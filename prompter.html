<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Datum Line prompter</title>
<meta name="description" content="The Datum Line pitch as a teleprompter: 1, 2 or 5 minutes, a path for each audience, a source on every number.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#14171a;--ink2:#454c50;--ink3:#8a9295;--rule:#e4e8e9;--chip:#f6f7f7;--pink:#be1e74;--green:#0f8f6c;--bar:rgba(255,255,255,.92)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0d0e;--ink:#eef1f2;--ink2:#c3c9cb;--ink3:#6f777a;--rule:#1d2124;--chip:#14171a;--pink:#ef74ad;--green:#3fbf96;--bar:rgba(11,13,14,.92)}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Geist,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px;border-radius:8px}

#bar{position:fixed;inset:0 0 auto;z-index:3;display:flex;flex-wrap:wrap;align-items:center;gap:8px 21px;padding:13px 21px;background:var(--bar);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);font:500 13px/1 "Geist Mono",ui-monospace,monospace;transition:opacity .6s}
#bar.idle{opacity:.08}
.seg{display:flex;gap:3px;background:var(--chip);border-radius:8px;padding:3px}
.seg button{padding:7px 11px;border-radius:6px;color:var(--ink3)}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(20,23,26,.12)}
.sp{flex:1}
.tog{padding:7px 10px;border-radius:8px;color:var(--ink3)}
.tog[aria-pressed=true]{color:var(--pink);background:var(--chip)}
#play{width:34px;height:34px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center}
#play svg{width:13px;height:13px}
#clock{color:var(--ink2);min-width:11ch}
#speed{display:flex;align-items:center;gap:2px;color:var(--ink3)}
#speed button{width:26px;height:26px;border-radius:6px}
#speed button:hover,.tog:hover,.seg button:hover{color:var(--ink)}
#help{position:relative}
#keys{display:none;position:absolute;right:0;top:34px;background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:13px 16px;box-shadow:0 8px 34px rgba(20,23,26,.12);white-space:nowrap;line-height:1.9;color:var(--ink2)}
#keys b{display:inline-block;min-width:6ch;color:var(--ink);font-weight:500}
#help[aria-expanded=true] #keys{display:block}

#mark{position:fixed;left:0;right:0;top:38vh;height:0;border-top:1px dashed var(--rule);pointer-events:none;z-index:1}
#mark::before{content:"";position:absolute;left:13px;top:-5px;width:9px;height:9px;border-radius:50%;background:var(--pink)}

#s{max-width:860px;margin:0 auto;padding:38vh 34px 62vh}
.b{margin:0 0 .5em;cursor:pointer;transition:opacity .5s}
.l1{font-size:clamp(27px,4.2vw,48px);font-weight:600;line-height:1.25;letter-spacing:-.01em}
.l2{font-size:clamp(21px,3vw,33px);font-weight:500;line-height:1.35;color:var(--ink2);padding-left:1.2em}
.l3{font-size:clamp(17px,2.2vw,24px);font-weight:400;line-height:1.45;color:var(--ink3);padding-left:2.6em}
.past{opacity:.28}
.off{opacity:.22}
mark{background:none;color:var(--pink);font-weight:600}
.l3 mark{font-weight:500}
.gap{color:var(--ink3);font-weight:400}
sup{font:500 .4em "Geist Mono",monospace;vertical-align:1em;margin-left:.3em;letter-spacing:0}
sup a{color:var(--green);text-decoration:none;margin-right:.4em}

#refs{max-width:860px;margin:0 auto;padding:34px 34px 89px;border-top:1px solid var(--rule);color:var(--ink3);font-size:14px;line-height:1.6}
#refs ol{list-style:none;padding:0;margin:0}
#refs li{margin:0 0 5px}
#refs code{display:inline-block;min-width:8ch;color:var(--green);font:500 12px "Geist Mono",monospace}
#refs a{color:var(--ink2);text-decoration-color:var(--rule)}

@media (max-width:700px){#bar{padding:8px 16px;gap:8px}.sp,#help{display:none}#s,#refs{padding-left:16px;padding-right:16px}.seg button{padding:6px 8px}}
@media (prefers-reduced-motion:reduce){.b,#bar{transition:none}}
</style>
</head>
<body>
<div id="bar" role="toolbar" aria-label="Prompter">
  <div class="seg" id="aud" aria-label="Who you're talking to"></div>
  <div class="seg" id="dep" aria-label="Length"></div>
  <div class="sp"></div>
  <button class="tog" id="cue" aria-pressed="false" title="Cues: only the lit words; you say the rest (C)">cues</button>
  <button class="tog" id="path" aria-pressed="false" title="Whole script, with this path lit (P)">whole script</button>
  <div id="speed"><button id="slow" aria-label="Slower">−</button><span id="wpm" title="words a minute">130</span><button id="fast" aria-label="Faster">+</button></div>
  <span id="clock">0:00</span>
  <button id="play" aria-label="Play or pause (space)"></button>
  <div id="help" aria-expanded="false"><button class="tog" id="q" aria-label="Keys">?</button>
    <div id="keys"><div><b>space</b>play, pause</div><div><b>← →</b>previous, next line</div><div><b>↑ ↓</b>faster, slower</div><div><b>1 2 3</b>1, 2 or 5 minutes</div><div><b>[ ]</b>audience</div><div><b>C</b>cues</div><div><b>P</b>whole script</div><div><b>T</b>back to the top</div><div><b>click</b>jump to a line</div></div></div>
</div>
<div id="mark"></div>
<main id="s"></main>
<section id="refs"><ol id="rl"></ol></section>
<script>
/* Beats: [level, audiences ("*" = all), text, sources]. Level 1 is the 1-minute path; 2 adds up to 2 minutes; 3 up to about 5.
   [[words]] are lit for every audience, [[words|A AV]] only for those; adjacent alternatives [[x|A]][[y|BV]] pick one per audience.
   Audiences: A Astera, BV bio VC, AV AI VC, BC bio colleague, AC AI/ML colleague. */
const AUD = [["A","Astera"],["BV","Bio VC"],["AV","AI VC"],["BC","Bio colleague"],["AC","AI/ML colleague"]];
const LEN = [[1,"1 min"],[2,"2 min"],[3,"5 min"]];
const BEATS = [
[1,"*","Hi, I'm [[Kat Titterton]].",""],
[2,"*","It started with [[one frog egg|A BC]] at MGH: does it look normal? I've asked that at every bench since.","cv"],
[3,"A BC BV","Neurons at AbbVie. Brain tissue at MIT. [[Ten million Cell Painting images|BV BC]] at Axiom.","cv"],
[3,"AV AC","[[Ten million Cell Painting images]] at Axiom, and I taught myself to code at night to read them.","cv"],
[2,"*","Public and private institutions [[ask the same question|A BC AC BV AV]]:",""],
[1,"*","[[Do my cells look normal?]] Compared with whom?",""],
[3,"*","I co-authored Cell Painting papers with the Broad, and invented [[two low-noise measures of morphology change|BC AC BV]] that also catch batch drift.","cv"],
[3,"BC BV A","Today each lab judges alone. It searches, asks, then guesses, and [[a wrong call costs a screen|BV BC]], or months.","d02"],
[3,"BV A","About [[$28 billion a year]] of US preclinical research can't be reproduced, and [[36 percent|BV]] of that traces back to cells and reagents.","freedman"],
[3,"AV AC A BV","Why now? Public cell data has exploded. JUMP alone holds [[1.8 billion cells|AV BV]], and the field is pooling it to [[train virtual cells|AV AC A]].","jump d03"],
[3,"AV","Biohub, Arc, Xaira, Noetik and Rivercell are building those models. [[Nobody calibrates across labs]] yet.","fro"],
[2,"*","So I looked at public data: [[eleven labs]], same cells, same six dyes, no drug.","jump"],
[1,"*","A classifier names the lab from untreated control wells [[99.9 percent]] of the time.","e1"],
[2,"AC AV","Chance is nine percent, and it's scored on [[plates it never saw|AC]].","e1"],
[3,"A BV BC","Chance is nine percent.","e1"],
[1,"*","So the first thing an AI model learns from pooled cell images is [[the lab, not the biology|A AV AC BV]][[the lab|BC]].",""],
[2,"AC AV","A benchmark that doesn't [[hold out the lab|AC]] grades that memory, [[not biology|AV]].",""],
[3,"BC AC A","Each lab's normal sits [[six times|BC AC]] further from the next lab's than from its own noise.","d04"],
[3,"BC AC A BV","And labs drift. The further a batch drifts, the less its [[known drug answers agree|BC A BV]]: a rank correlation of [[minus 0.71|AC]] across 118 batches.","e10"],
[3,"BC A","In one public lab, four batches in a row, the wells labelled [[positive control show no effect|BC A]].","e11"],
[3,"BC AC A BV","Same drug, same dose, different picture: RSL3's wells agree [[0.9 inside a lab, and 0.49 across labs]].","e16"],
[3,"BC AC A","A lab can move without seeing it: its latest batches sit [[further from its own baseline than from another lab]], while cell counts look fine.","move"],
[3,"BV AV BC","Today a lab checks its cells with STR, mycoplasma tests, Z-prime and CellProfiler. Each answers [[one question about one plate|BC]]. [[None compares a lab with every other lab|BV AV]].","d08"],
[1,"*","[[Datum Line]] is the fix: every lab's control wells on [[one open map|A BC AC]][[one map|BV AV]].",""],
[1,"*","[[Controls|A BC AC]] are the closest thing biology has to [[ground truth|A AC AV]].",""],
[2,"*","Every lab runs them, [[the answer is known|BC AC]], and [[nobody needs to keep them secret|A BV AV]].",""],
[3,"BC AC","The known answers hold across labs: [[AMG900|BC]] enlarges nuclei in all eleven, [[1.3 to 2.1 times|AC BC]].","e18"],
[3,"AC AV A","Measure every image the same way, put each batch in [[the field's frame|AC]], and labs agree more in [[121 of 125 batches|AC AV A]].","e12"],
[3,"AV AC BV A","It may not even need dyes. A [[frozen vision model|AC AV]] names the lab from [[one brightfield image|BV A AV]], 99.5 percent of the time, across eight labs.","e17"],
[3,"A AC AV","The brightfield test asks whether a plain, [[label-free image|A AC]] can carry the same check, so [[any microscope can join|AV A]].","e17"],
[3,"AC AV","Under the hood it's simple: [[one pipeline and a frozen vision model|AC]], no per-lab tuning. [[Versioned releases, a leaderboard, an API|AV AC]].","repo"],
[3,"A AV BV","Labels can lie, cells cannot. An open reference lets [[any lab prove what it tested]].","d03"],
[1,"A","In the residency I'd build [[the map]], and [[a check]], so a lab knows a batch looks normal before the screen.",""],
[1,"A","And [[a benchmark]] that asks of any model: did it learn [[the cells, or the lab?]]","a07"],
[1,"BC","Send your [[control wells]], and you'll know a batch looks normal [[before the screen]], not after.",""],
[2,"BC","No new assay, no new instrument. It reads [[the images you already take]].",""],
[3,"BC","Your lab keeps its data and [[a share of every membership that uses it]]. Every record is signed and timestamped, so anyone can check it.","readme"],
[3,"BC A","Use it when you [[onboard a cell line, lock an SOP or call a hit|BC]][[onboard a cell line or call a hit|A]].",""],
[1,"AC","On top sits [[a benchmark]]: held-out labs, drugs with known answers, plates with planted faults. Did your model learn [[the cells, or the lab?]]","a07"],
[1,"BV","Screening teams pay to [[check their batches against the field]]. Labs that share join free and [[keep a share]].","fro d06"],
[1,"AV","Every virtual-cell model needs [[that benchmark]], and AI teams will query the map [[by API]].","d07"],
[2,"A AC","All of it open: [[data CC0, code MIT]], and records [[an AI agent can read|A]] with no person in the loop.",""],
[2,"BV AV","[[No tool watches every lab over time.]] Platforms erase the lab signal, and whoever holds a reference [[can't profit from the answer|BV]].","d08 fro"],
[3,"BV AV","And it compounds: every lab that joins [[tightens everyone else's normal]].","d06"],
[3,"BV AV","On our base case, every likely buyer adds up to about [[$84 million a year|BV]], and it pays for itself at a tenth of that. AI teams [[by API|AV]] aren't priced yet.","d07"],
[3,"BV","Most of that is screening labs, at [[$10k per cell line per quarter]].","d07"],
[3,"A AV AC","AI agents can query it directly: [[check a batch against the field|A AC]], [[pull comparable data|AV]], no email thread required.",""],
[3,"AC","Every number reruns from a script, and [[the repo lists what didn't reproduce]].","repo"],
[3,"A","The benchmark grades any model on held-out labs, drugs with known answers and about [[60 fault plates]]: a bubble, a blur, a bad exposure, a wrong label.","a07"],
[3,"A","Why Astera? [[Open first]] is already how this runs. Radial's OpenADMET makes the same move for chemistry, and [[a cohort beats a desk alone]].","astera"],
[3,"A BV AV","By month 18: [[the first data outside JUMP|A BV AV]] from three partner labs, [[a benchmark playground|A AV]] and the brightfield test.","d09"],
[2,"*","Today it's me, [[public data and an open repo|A AC BC]][[public data|BV AV]].","repo"],
[1,"A","With [[Astera]], Datum Line becomes [[a reference the field can stand on]].",""],
[3,"A","After the residency, a [[nonprofit FRO]] holds the reference, [[open for good]].","fro"],
[1,"BV AV","We're raising [[$1.8M]] to start a nonprofit FRO: [[18 months to the first paying members]].","d09"],
[3,"BV AV","The map stays open. [[A member spin-out]] sells private checks and the API.","fro"],
[1,"BC","[[Have control images?]] Talk to me. There's [[a tile for your lab]].","d09"],
[1,"AC","Want to [[grade your model on held-out labs]]? The data and code are open.","repo"],
[1,"*","[[Let's map normal together.]]",""]
];
const REFS = {
 cv:["Kat Titterton, background","index.html","deck slide 02: 8 peer-reviewed papers, two in Nature Communications; 100,000+ compounds imaged"],
 d02:["Deck slide 02","index.html","today a lab searches, asks, then guesses"],
 d03:["Deck slide 03","index.html","JUMP Cell Painting: 11 labs, 1.8B cells; labels can lie, cells cannot"],
 d04:["Deck slide 04","index.html","each lab's normal sits 6× further apart than its own noise"],
 d06:["Deck slide 06","index.html","labs own their data and earn a share; the error falls as 1/√n"],
 d07:["Deck slide 07, archive A22","archive.html#A22","base case $84M/year, self-sustaining at a tenth; every count and price an assumption"],
 d08:["Deck slide 08, the landscape","docs/landscape.html","no tool watches every lab over time"],
 d09:["Deck slide 09","index.html","raising $1.8M to start a nonprofit FRO, 18 months to first paying members"],
 fro:["The FRO page","docs/fro.html","a nonprofit holds the open reference; a member spin-out sells private checks; open for good"],
 a07:["Archive A7","archive.html#A7","the benchmark: held-out labs, known answers, about 60 fault plates"],
 e1:["results e1","https://github.com/kat-titter/datum-line/blob/main/results/SUMMARY.md","93,228 control wells, 1,872 plates, 11 labs: lab named at 99.9% balanced accuracy vs 9.1% chance, on unseen plates"],
 e10:["results e10","https://github.com/kat-titter/datum-line/blob/main/results/SUMMARY.md","drift against agreement of known answers: Spearman −0.71 over 118 batches"],
 e11:["results e11","https://github.com/kat-titter/datum-line/blob/main/results/SUMMARY.md","4 consecutive batches, 65 plates: labelled positive controls show no effect"],
 e12:["results e12","https://github.com/kat-titter/datum-line/blob/main/results/SUMMARY.md","in the field's frame, labs agree more in 121 of 125 batches"],
 e16:["results e16, archive A9","archive.html#A9","RSL3 at 10 µM in three labs: wells agree 0.90 inside a lab, 0.49 across"],
 e17:["results e17","https://github.com/kat-titter/datum-line#readme","frozen vision model, one brightfield image: lab named at 99.5% across 8 labs, median of 20 splits"],
 e18:["results e18, e19","https://github.com/kat-titter/datum-line#readme","AMG900 at 5 µM enlarges nuclei in all 11 labs, ×1.3 to 2.1 (median ×1.9), 1,829 plates"],
 move:["README","https://github.com/kat-titter/datum-line#readme","a lab can move without seeing it; 6 of 129 batches do"],
 readme:["README","https://github.com/kat-titter/datum-line#readme","labs keep their data and a share of every membership that uses it; records signed and timestamped"],
 jump:["Chandrasekaran et al. 2023","https://doi.org/10.1101/2023.03.23.534023","JUMP Cell Painting: same U2OS cells, same six dyes, many labs"],
 freedman:["Freedman, Cockburn and Simcoe 2015","https://doi.org/10.1371/journal.pbio.1002165","about $28B a year of US preclinical research is irreproducible; 36% from biological reagents and reference materials"],
 astera:["Astera Residency","https://astera.org/residency/","benchmarking and evals for biological AI; Radial's OpenADMET"],
 repo:["The open repo","https://github.com/kat-titter/datum-line","code MIT, data CC0; every number from a script"]
};
const S = {aud:"A", depth:2, whole:false, cue:false, wpm:130, on:false};
const s = document.getElementById('s'), $ = id => document.getElementById(id);
const RX = /\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g;
const has = (a, k) => a.split(" ").includes(k);
const onPath = b => b[1] === "*" || has(b[1], S.aud);
const pick = t => t.replace(/((?:\[\[[^\]]+\|[^\]]+\]\]){2,})/g, g => { const ms=[...g.matchAll(RX)]; const hit=ms.find(m=>has(m[2],S.aud)); return hit ? hit[0] : "[[" + ms[0][1] + "|-]]"; });
const words = t => pick(t).replace(RX, "$1").split(/\s+/).filter(Boolean).length;
function html(t){ const v = pick(t), lit = a => !a || has(a,S.aud);
  if (S.cue){ const m=[...v.matchAll(RX)].filter(x=>lit(x[2])).map(x=>"<mark>"+x[1]+"</mark>"); return m.length ? m.join(' <span class="gap">…</span> ') : '<span class="gap">'+v.replace(RX,"$1").split(" ").slice(0,4).join(" ")+' …</span>'; }
  return v.replace(RX, (m,w,a) => lit(a) ? "<mark>"+w+"</mark>" : w); }
const shown = () => BEATS.filter(b => b[0] <= S.depth && (S.whole || onPath(b)));
const pathWords = d => BEATS.filter(b => b[0] <= d && onPath(b)).reduce((n,b)=>n+words(b[2]),0);
const mmss = x => Math.floor(x/60)+":"+String(Math.round(x%60)).padStart(2,"0");
const PLAY='<svg viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z" fill="currentColor"/></svg>', PAUSE='<svg viewBox="0 0 12 12"><path d="M2 1h3v10H2zM7 1h3v10H7z" fill="currentColor"/></svg>';
let total = 0, el = 0, last = 0;
function render(){
  s.innerHTML = shown().map(b => '<p class="b l'+b[0]+(onPath(b)?'':' off')+'">'+html(b[2])+(b[3]?'<sup>'+b[3].split(" ").map(r=>'<a href="#ref-'+r+'" title="'+REFS[r][0]+': '+REFS[r][2]+'">'+r+'</a>').join("")+'</sup>':'')+'</p>').join("");
  $('aud').innerHTML = AUD.map(([k,n])=>'<button aria-pressed="'+(k===S.aud)+'" data-a="'+k+'">'+n+'</button>').join("");
  $('dep').innerHTML = LEN.map(([d,n])=>'<button aria-pressed="'+(d===S.depth)+'" data-d="'+d+'" title="'+mmss(pathWords(d)/S.wpm*60)+' at '+S.wpm+' words a minute">'+n+'</button>').join("");
  $('path').setAttribute('aria-pressed', S.whole); $('cue').setAttribute('aria-pressed', S.cue); $('wpm').textContent = S.wpm;
  total = pathWords(S.depth)/S.wpm*60; clock(); focus();
  history.replaceState(null, "", "#"+S.aud.toLowerCase()+"-"+S.depth);
}
function clock(){ $('clock').textContent = mmss(el)+" / "+mmss(total); $('play').innerHTML = S.on ? PAUSE : PLAY; }
function focus(){ const y = innerHeight*.38; for (const p of s.children) p.classList.toggle('past', p.getBoundingClientRect().bottom < y - 2); }
$('rl').innerHTML = Object.entries(REFS).map(([k,[n,u,w]])=>'<li id="ref-'+k+'"><code>'+k+'</code><a href="'+u+'" target="_blank" rel="noopener">'+n+'</a>, '+w+'</li>').join("");
const h = location.hash.slice(1).split("-"), ha = AUD.find(a=>a[0].toLowerCase()===h[0]); if (ha) S.aud = ha[0]; if (+h[1]>=1 && +h[1]<=3) S.depth = +h[1];
render();
const endY = () => s.offsetHeight - innerHeight;
function tick(now){ if (S.on){ const dt=Math.min(.1,(now-last)/1000); el+=dt; scrollBy(0, Math.max(0,endY())/Math.max(1,total)*dt); clock(); if (scrollY >= endY()-1) toggle(false); } last=now; requestAnimationFrame(tick); }
requestAnimationFrame(tick);
addEventListener('scroll', focus, {passive:true});
let idle; function wake(){ $('bar').classList.remove('idle'); clearTimeout(idle); if (S.on) idle = setTimeout(()=>$('bar').classList.add('idle'), 1800); }
addEventListener('mousemove', wake); addEventListener('touchstart', wake, {passive:true});
function toggle(v){ S.on = v===undefined ? !S.on : v; clock(); wake(); }
function step(dir){ const y=innerHeight*.38, ps=[...s.children]; const t = dir>0 ? ps.find(p=>p.getBoundingClientRect().top > y+4) : ps.reverse().find(p=>p.getBoundingClientRect().top < y-4); if (t) scrollBy({top:t.getBoundingClientRect().top-y, behavior:"smooth"}); }
function top0(){ scrollTo(0,0); el=0; toggle(false); }
function set(k,v){ S[k]=v; render(); }
document.addEventListener('click', e => { const t=e.target.closest('button,a,.b'); if (!t || t.tagName==='A') return;
  if (t.dataset.a) set('aud', t.dataset.a); else if (t.dataset.d) set('depth', +t.dataset.d);
  else if (t.id==='path') set('whole', !S.whole); else if (t.id==='cue') set('cue', !S.cue); else if (t.id==='play') toggle();
  else if (t.id==='slow') set('wpm', Math.max(60,S.wpm-10)); else if (t.id==='fast') set('wpm', S.wpm+10);
  else if (t.id==='q') $('help').setAttribute('aria-expanded', $('help').getAttribute('aria-expanded')!=='true');
  else if (t.classList.contains('b')) scrollBy({top:t.getBoundingClientRect().top-innerHeight*.38, behavior:"smooth"}); });
addEventListener('keydown', e => { if (e.metaKey||e.ctrlKey||e.altKey) return; if (e.target.tagName==='BUTTON' && (e.key===' '||e.key==='Enter')) return; const i=AUD.findIndex(a=>a[0]===S.aud);
  const map = {' ':()=>toggle(), ArrowUp:()=>set('wpm',S.wpm+10), ArrowDown:()=>set('wpm',Math.max(60,S.wpm-10)), ArrowRight:()=>step(1), ArrowLeft:()=>step(-1),
    '1':()=>set('depth',1), '2':()=>set('depth',2), '3':()=>set('depth',3), ']':()=>set('aud',AUD[(i+1)%5][0]), '[':()=>set('aud',AUD[(i+4)%5][0]),
    c:()=>set('cue',!S.cue), p:()=>set('whole',!S.whole), t:top0};
  const f = map[e.key.length===1 ? e.key.toLowerCase() : e.key]; if (f){ f(); e.preventDefault(); wake(); } });
</script>
</body>
</html>
